name: ChargePoint Poller

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes (may be delayed slightly on busy runners)
  workflow_dispatch:

jobs:
  run-poller:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: /opt/homebrew/bin/python3.11 -m pip install -r requirements.txt

      - name: Run poller once
        env:
          # Optional: CHARGING_LIMIT_MINUTES (default 120) — add here or in repo env if you change the co-op window.
          CHARGEPOINT_USER: ${{ secrets.CHARGEPOINT_USER }}
          CHARGEPOINT_PASS: ${{ secrets.CHARGEPOINT_PASS }}
          CHARGEPOINT_SESSION_TOKEN: ${{ secrets.CHARGEPOINT_SESSION_TOKEN }}
          CHARGEPOINT_STATION_IDS: ${{ secrets.CHARGEPOINT_STATION_IDS }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: /opt/homebrew/bin/python3.11 poller.py
