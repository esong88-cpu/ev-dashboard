<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samtec EV Chargers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        samtec: {
                            orange: "#ea580c",
                            dark: "#0a0a0a",
                            asphalt: "#1c1917",
                            line: "#44403c",
                        },
                    },
                    fontFamily: {
                        mono: ["'JetBrains Mono'", "ui-monospace", "Courier New", "monospace"],
                    },
                },
            },
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: "JetBrains Mono", ui-monospace, monospace; }
        @keyframes charge-pulse {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(234, 88, 12, 0.9)); opacity: 1; }
            50% { filter: drop-shadow(0 0 14px rgba(251, 146, 60, 1)); opacity: 0.95; }
        }
        @keyframes overdue-pulse {
            0%, 100% { filter: drop-shadow(0 0 7px rgba(220, 38, 38, 0.95)); opacity: 1; }
            50% { filter: drop-shadow(0 0 18px rgba(248, 113, 113, 1)); opacity: 0.9; }
        }
        .car-charging { animation: charge-pulse 2s ease-in-out infinite; }
        .car-overdue { animation: overdue-pulse 1.35s ease-in-out infinite; }
        .stall-lines {
            background-image: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 8px,
                rgba(68, 64, 60, 0.5) 8px,
                rgba(68, 64, 60, 0.5) 10px
            );
        }
        /* TV / wall: add ?kiosk=1 to the URL */
        body.kiosk-mode {
            font-size: 1.0625rem;
        }
        body.kiosk-mode #main-wrap {
            max-width: 96rem;
        }
        body.kiosk-mode h1 {
            font-size: clamp(1.5rem, 4.5vw, 2.75rem);
        }
        body.kiosk-mode #status-summary {
            font-size: clamp(1.05rem, 2.8vw, 1.45rem);
            margin-top: 0.75rem;
        }
        body.kiosk-mode h2 {
            font-size: 0.7rem;
            margin-bottom: 0.9rem;
        }
        body.kiosk-mode #parking-lot {
            gap: clamp(0.9rem, 1.2vw, 1.4rem);
        }
        @media (min-width: 1024px) {
            body.kiosk-mode #parking-lot { gap: 1.4rem; }
        }
    </style>
</head>
<body class="min-h-screen bg-samtec-dark text-stone-300 font-mono antialiased">
    <div id="main-wrap" class="max-w-5xl mx-auto px-4 py-6 sm:px-6 sm:py-10">
        <header class="border-b-2 border-samtec-orange pb-6 mb-8">
            <h1 class="text-xl sm:text-2xl font-bold tracking-[0.2em] text-samtec-orange uppercase">Samtec EV Chargers</h1>
            <p id="status-summary" class="text-sm sm:text-base text-stone-200 mt-2 font-semibold tabular-nums" aria-live="polite">—</p>
            <div class="flex items-center gap-2 mt-3 text-sm text-stone-400">
                <span id="live-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500 shrink-0"></span>
                <span id="live-label">connecting…</span>
            </div>
        </header>

        <section aria-label="Parking lot" class="mb-10">
            <h2 class="text-xs font-semibold tracking-[0.25em] text-samtec-orange uppercase mb-4">Lot</h2>
            <div id="parking-lot" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 min-h-[12rem]">
                <div class="col-span-full text-sm text-stone-500 py-8 text-center border border-dashed border-stone-600 rounded-lg">Loading…</div>
            </div>
        </section>

        <section class="mb-10">
            <h2 class="text-xs font-semibold tracking-[0.25em] text-stone-500 uppercase mb-4">Complete — move the car</h2>
            <div id="complete-list" class="flex flex-col border border-stone-700 rounded-lg overflow-hidden bg-samtec-asphalt/50 min-h-[4rem]">
                <div class="text-sm text-stone-500 px-4 py-3 border-b border-stone-800">None right now.</div>
            </div>
        </section>
    </div>

    <!-- Extend charging window -->
    <div id="extend-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4" aria-hidden="true">
        <div class="w-full max-w-sm rounded-lg border border-stone-600 bg-stone-900 p-5 shadow-xl">
            <h3 class="text-sm font-semibold text-samtec-orange uppercase tracking-widest mb-3">Extend window</h3>
            <p class="text-xs text-stone-500 mb-4">Adds time from now or from your current deadline, whichever is later. Others will see who extended.</p>
            <label class="block text-xs text-stone-400 mb-1">Your name</label>
            <input id="extend-name" type="text" maxlength="80" class="w-full mb-3 px-3 py-2 rounded bg-black border border-stone-600 text-stone-200 text-sm" placeholder="e.g. Jordan" />
            <label class="block text-xs text-stone-400 mb-1">Extra minutes</label>
            <input id="extend-minutes" type="number" min="15" max="480" value="120" class="w-full mb-4 px-3 py-2 rounded bg-black border border-stone-600 text-stone-200 text-sm" />
            <div class="flex justify-end gap-2">
                <button type="button" id="extend-cancel" class="px-3 py-1.5 text-xs rounded border border-stone-600 text-stone-400 hover:bg-stone-800">Cancel</button>
                <button type="button" id="extend-save" class="px-3 py-1.5 text-xs rounded bg-samtec-orange text-black font-semibold hover:opacity-90">Save</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMLfdk0kPpl3g_BjVkuUOLlivS25jZAQw",
            authDomain: "samtec-chargers.firebaseapp.com",
            databaseURL: "https://samtec-chargers-default-rtdb.firebaseio.com",
            projectId: "samtec-chargers",
            storageBucket: "samtec-chargers.firebasestorage.app",
            messagingSenderId: "815704178070",
            appId: "1:815704178070:web:208c3d76006fc1b0edf1b7",
            measurementId: "G-050F1LV7GQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const stationsRef = ref(db, "/stations");
        const extensionsRef = ref(db, "/slot_extensions");
        const resetsRef = ref(db, "/slot_resets");

        const params = new URLSearchParams(window.location.search);
        const isKiosk =
            params.get("kiosk") === "1" ||
            params.get("kiosk") === "true" ||
            params.get("kiosk") === "yes";
        if (isKiosk) {
            document.body.classList.add("kiosk-mode");
            document.title = "Samtec EV — Board";
        }

        const liveDot = document.getElementById("live-dot");
        const liveLabel = document.getElementById("live-label");
        const statusSummaryEl = document.getElementById("status-summary");
        const completeListEl = document.getElementById("complete-list");
        const parkingLotEl = document.getElementById("parking-lot");
        const extendModal = document.getElementById("extend-modal");
        const extendNameInput = document.getElementById("extend-name");
        const extendMinutesInput = document.getElementById("extend-minutes");
        const extendSaveBtn = document.getElementById("extend-save");
        const extendCancelBtn = document.getElementById("extend-cancel");

        const completeSince = new Map();
        const STALL_COUNT = 4;

        let lastStationPayload = null;
        let lastExtMap = {};
        let lastResetMap = {};
        let pendingExtendKey = null;

        function normStatus(s) {
            return String(s || "").trim().toLowerCase();
        }

        function statusBucket(raw) {
            const s = normStatus(raw);
            if (s === "available") return "available";
            if (s === "charging") return "charging";
            if (s === "complete") return "complete";
            return "other";
        }

        function formatDuration(ms) {
            if (ms < 0 || !Number.isFinite(ms)) return "—";
            const m = Math.floor(ms / 60000);
            const h = Math.floor(m / 60);
            const rem = m % 60;
            if (h > 0) return `${h}h ${rem}m`;
            return `${m}m`;
        }

        function stationTitle(entry) {
            const n = entry.name;
            if (Array.isArray(n)) {
                const parts = n.map((s) => String(s).trim()).filter(Boolean);
                if (parts.length >= 2) {
                    const first = parts[0].toLowerCase();
                    const second = parts[1].toLowerCase();
                    // ChargePoint often sends e.g. ["Samtec", "Samtec 01"] — avoid "Samtec Samtec 01".
                    if (second === first || second.startsWith(first + " ")) {
                        return parts.slice(1).join(" ").trim();
                    }
                }
                return parts.join(" ").trim();
            }
            if (typeof n === "string") return n;
            return `Station ${entry.device_id ?? "?"}`;
        }

        const META_KEYS = new Set(["last_updated", "charging_limit_minutes"]);

        /** Rows in stable order (device id, port) — no status sort (for fixed parking stalls). */
        function flattenPortsStable(stations) {
            const rows = [];
            for (const [id, entry] of Object.entries(stations || {})) {
                if (META_KEYS.has(id)) continue;
                if (!entry || typeof entry !== "object") continue;
                if (entry.error) continue;
                const title = stationTitle(entry);
                const ports = entry.ports && typeof entry.ports === "object" ? entry.ports : {};
                const keys = Object.keys(ports).sort((a, b) => Number(a) - Number(b));
                const portSessions =
                    entry.port_sessions && typeof entry.port_sessions === "object" ? entry.port_sessions : {};
                if (keys.length === 0) {
                    rows.push({
                        key: `${id}-0`,
                        deviceId: id,
                        portLabel: "",
                        title,
                        status: entry.station_status || "unknown",
                        sort: statusBucket(entry.station_status),
                        sessionStartedAt: null,
                        policyCompleteSince: null,
                    });
                } else {
                    for (const pk of keys) {
                        const sess = portSessions[pk];
                        const sessionStartedAt =
                            sess && typeof sess === "object" && sess.started_at ? String(sess.started_at) : null;
                        const policyCompleteSince =
                            sess && typeof sess === "object" && sess.policy_complete_since
                                ? String(sess.policy_complete_since)
                                : null;
                        rows.push({
                            key: `${id}-${pk}`,
                            deviceId: id,
                            portLabel: `Port ${pk}`,
                            title,
                            status: ports[pk],
                            sort: statusBucket(ports[pk]),
                            sessionStartedAt,
                            policyCompleteSince,
                        });
                    }
                }
            }
            rows.sort((a, b) => {
                const da = parseInt(String(a.deviceId), 10) || 0;
                const db = parseInt(String(b.deviceId), 10) || 0;
                if (da !== db) return da - db;
                const pa = String(a.portLabel).replace(/\D/g, "") || "0";
                const pb = String(b.portLabel).replace(/\D/g, "") || "0";
                return parseInt(pa, 10) - parseInt(pb, 10);
            });
            return rows;
        }

        function parseIsoToMs(raw) {
            if (raw == null || raw === "") return NaN;
            if (typeof raw === "number" && Number.isFinite(raw)) {
                return raw > 1e12 ? raw : raw * 1000;
            }
            if (typeof raw === "string") {
                const p = Date.parse(raw);
                if (!Number.isNaN(p)) return p;
            }
            return NaN;
        }

        function policyDeadlineMs(row, limitMin, extMap) {
            const start = parseIsoToMs(row.sessionStartedAt);
            if (!Number.isFinite(start)) return null;
            const base = start + limitMin * 60 * 1000;
            const ext = extMap[row.key];
            if (ext && typeof ext.until_ms === "number" && Number.isFinite(ext.until_ms)) return ext.until_ms;
            return base;
        }

        /** Lot + “complete” list use co-op policy; falls back to ChargePoint if no session clock yet. */
        function effectiveBucket(row, limitMin, extMap, now) {
            const cp = statusBucket(row.status);
            if (cp === "available") return "available";
            const deadline = policyDeadlineMs(row, limitMin, extMap);
            if (deadline == null) return cp;
            if (now >= deadline) return "complete";
            if (cp === "charging" || cp === "complete") return "charging";
            return cp;
        }

        function annotateRows(stations, extMap, resetMap, now) {
            const limitMin = Number(stations?.charging_limit_minutes);
            const lim = Number.isFinite(limitMin) && limitMin > 0 ? limitMin : 120;
            const stable = flattenPortsStable(stations);
            return stable.map((r) => {
                const cpBucket = statusBucket(r.status);
                const reset = resetMap && typeof resetMap === "object" ? resetMap[r.key] : null;
                const resetMs =
                    reset && typeof reset.at_ms === "number" && Number.isFinite(reset.at_ms)
                        ? reset.at_ms
                        : NaN;
                const startMs = parseIsoToMs(r.sessionStartedAt);
                const sessionStartedAt =
                    Number.isFinite(resetMs) && (!Number.isFinite(startMs) || resetMs > startMs)
                        ? reset.at || new Date(resetMs).toISOString()
                        : r.sessionStartedAt;
                const row = { ...r, sessionStartedAt };
                return {
                    ...row,
                    cpBucket,
                    eff: effectiveBucket(row, lim, extMap, now),
                    deadlineMs: policyDeadlineMs(row, lim, extMap),
                    limitMin: lim,
                };
            });
        }

        function flattenPortsSortedByStatus(stations, extMap, resetMap, now) {
            const rows = annotateRows(stations, extMap, resetMap, now);
            const order = { available: 0, charging: 1, complete: 2, other: 3 };
            rows.sort(
                (a, b) =>
                    (order[a.eff] ?? 9) - (order[b.eff] ?? 9) || a.title.localeCompare(b.title)
            );
            return rows;
        }

        function stallSlotsFromRows(rows) {
            const slots = [];
            for (let i = 0; i < STALL_COUNT; i++) slots.push(rows[i] ?? null);
            return slots;
        }

        function carVariantForKey(key) {
            let h = 0;
            for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
            return h % 3;
        }

        /** Simple side-view cars. Orange = within window; red = time to move. */
        function carSvg(variant, mode = "charging") {
            const bodies = [
                "M8 38h104c4 0 8-3 8-8V22c0-6-5-11-11-11H25l-8-6H8v33z M28 18h72v12H28z",
                "M6 36h108l6-4c3-2 5-5 5-9V20c0-7-6-12-13-12H22l-6-5H6v33z M30 16h68v14H30z",
                "M10 37h100c5 0 10-4 10-10v-8c0-6-5-10-11-10H26l-7-5h-9v33z M32 17h64v13H32z",
            ];
            const wheels = "M22 44h10v6H22zm66 0h10v6H88z";
            const v = bodies[variant] || bodies[0];
            const overdue = mode === "overdue";
            const fill = overdue ? "#dc2626" : "#ea580c";
            const cls = overdue ? "car-overdue" : "car-charging";
            return `<svg viewBox="0 0 120 52" class="w-full h-auto max-h-[7rem] mx-auto ${cls}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path fill="${fill}" d="${v}"/>
                <path fill="#0a0a0a" d="${wheels}"/>
                <path fill="#292524" opacity="0.35" d="M38 20h44v8H38z"/>
            </svg>`;
        }

        function stallStatusLabel(bucket) {
            if (bucket === "available") return { text: "Open", class: "text-stone-500" };
            if (bucket === "charging") return { text: "Charging", class: "text-samtec-orange font-semibold" };
            if (bucket === "complete") return { text: "Complete", class: "text-orange-300" };
            return { text: "Unknown", class: "text-stone-500" };
        }

        function escAttr(s) {
            return String(s)
                .replace(/&/g, "&amp;")
                .replace(/"/g, "&quot;")
                .replace(/</g, "&lt;");
        }

        function renderParkingLot(slots, extMap) {
            if (slots.every((s) => s === null)) {
                parkingLotEl.innerHTML = `<div class="col-span-full text-sm text-stone-500 py-8 text-center border border-dashed border-stone-600 rounded-lg">No station data.</div>`;
                return;
            }
            parkingLotEl.innerHTML = slots
                .map((r, idx) => {
                    const n = idx + 1;
                    if (!r) {
                        return `
                    <div class="rounded-lg border-2 border-dashed border-stone-700 bg-samtec-asphalt p-3 flex flex-col min-h-[11rem] stall-lines">
                        <div class="text-[10px] tracking-widest text-stone-600 uppercase mb-1">Spot ${n}</div>
                        <div class="flex-1 flex items-center justify-center text-stone-600 text-xs">—</div>
                    </div>`;
                    }
                    const bucket = r.eff;
                    const cpBucket = r.cpBucket;
                    const label = r.portLabel ? `${r.title} · ${r.portLabel}` : r.title;
                    const { text: stText, class: stClass } = stallStatusLabel(bucket);
                    const showCar = bucket === "charging" || bucket === "complete";
                    const isOverdue = bucket === "complete";
                    const variant = carVariantForKey(r.key);
                    const cpEarly =
                        bucket === "charging" && cpBucket === "complete"
                            ? `<div class="text-[10px] text-stone-500 text-center mt-1 leading-tight">ChargePoint: session complete · co-op timer still running</div>`
                            : "";
                    const idleHint = bucket === "available" ? "No vehicle" : "";
                    const resetButton = `<button type="button" data-reset-key="${escAttr(
                        r.key
                    )}" class="absolute top-0 left-0 z-10 text-[10px] uppercase tracking-wide px-2 py-0.5 rounded border border-stone-600 text-stone-400 hover:border-sky-400 hover:text-sky-300 bg-black/60">Reset</button>`;
                    const statusButton = isOverdue
                        ? `<div class="absolute top-0 right-0 z-10 text-[10px] uppercase tracking-wide px-2 py-0.5 rounded border border-red-500 text-red-300 bg-black/70">Move</div>`
                        : `<button type="button" data-extend-key="${escAttr(
                              r.key
                          )}" class="absolute top-0 right-0 z-10 text-[10px] uppercase tracking-wide px-2 py-0.5 rounded border border-stone-500 text-stone-300 hover:border-samtec-orange hover:text-samtec-orange bg-black/60">Extend</button>`;
                    const carHtml = showCar
                        ? `<div class="relative w-full pt-5">${resetButton}${statusButton}${carSvg(
                              variant,
                              isOverdue ? "overdue" : "charging"
                          )}</div>`
                        : `<div class="flex-1 flex items-center justify-center text-stone-600 text-[11px] px-1 text-center">${idleHint}</div>`;
                    const ext = extMap[r.key];
                    const extLine =
                        ext && ext.by
                            ? `<div class="text-[10px] text-stone-500 text-center mt-1">Extended by ${escAttr(ext.by)}</div>`
                            : "";
                    const sessionStartMs = parseIsoToMs(r.sessionStartedAt);
                    const hereLine =
                        bucket !== "available" && Number.isFinite(sessionStartMs)
                            ? `<div class="text-[10px] text-stone-500 text-center mt-1">Here · ${formatDuration(
                                  Date.now() - sessionStartMs
                              )}</div>`
                            : "";

                    return `
                <div class="rounded-lg border-2 ${
                    isOverdue
                        ? "border-red-600 shadow-[0_0_22px_rgba(220,38,38,0.3)]"
                        : showCar
                          ? "border-samtec-orange shadow-[0_0_20px_rgba(234,88,12,0.25)]"
                          : "border-stone-700"
                } bg-samtec-asphalt p-3 flex flex-col min-h-[11rem] relative">
                    <div class="text-[10px] tracking-widest text-stone-500 uppercase mb-1 truncate" title="${escAttr(label)}">Spot ${n}</div>
                    <div class="text-xs text-stone-400 mb-2 line-clamp-2 min-h-[2rem]">${escAttr(label)}</div>
                    <div class="flex-1 flex flex-col justify-center stall-lines rounded min-h-[5.5rem] px-1">${carHtml}</div>
                    ${cpEarly}
                    <div class="mt-2 text-center text-xs ${stClass}">${stText}</div>
                    ${hereLine}
                    ${extLine}
                </div>`;
                })
                .join("");
        }

        function updateCompleteTracking(rows) {
            const seen = new Set();
            for (const r of rows) {
                if (r.eff !== "complete") {
                    completeSince.delete(r.key);
                    continue;
                }
                seen.add(r.key);
                if (!completeSince.has(r.key)) completeSince.set(r.key, Date.now());
            }
            for (const k of [...completeSince.keys()]) {
                if (!seen.has(k)) completeSince.delete(k);
            }
        }

        function renderCompleteList(rows) {
            const completeRows = rows.filter((r) => r.eff === "complete");
            if (completeRows.length === 0) {
                completeListEl.innerHTML = `<div class="text-sm text-stone-500 px-4 py-3 border-b border-stone-800">None right now.</div>`;
                return;
            }
            completeListEl.innerHTML = completeRows
                .map((r) => {
                    const policyMs = parseIsoToMs(r.policyCompleteSince);
                    const tabMs = completeSince.get(r.key) ?? Date.now();
                    const started = Number.isFinite(policyMs) ? policyMs : tabMs;
                    const over = formatDuration(Date.now() - started);
                    const label = r.portLabel ? `${r.title} (${r.portLabel})` : r.title;
                    return `
                <div class="flex justify-between gap-3 px-4 py-3 border-b border-stone-800 last:border-0 complete-row bg-black/20" data-key="${escAttr(
                    r.key
                )}">
                    <span class="text-stone-300 text-sm">${escAttr(label)}</span>
                    <span class="text-orange-400 font-semibold text-sm shrink-0 complete-duration">Complete · ${over}</span>
                </div>`;
                })
                .join("");
        }

        let lastRowsSorted = [];
        let lastPollerIso = null;
        /** Green: data this fresh. Orange: between fresh and offline. Red: older than offline. */
        const FRESH_MS = 5 * 60 * 1000;
        const OFFLINE_MS = 10 * 60 * 1000;

        function parseLastUpdated(raw) {
            if (raw == null || raw === "") return NaN;
            if (typeof raw === "number" && Number.isFinite(raw)) {
                return raw > 1e12 ? raw : raw * 1000;
            }
            if (typeof raw === "string") {
                const p = Date.parse(raw);
                if (!Number.isNaN(p)) return p;
            }
            return NaN;
        }

        /** Human-readable age since last poll (e.g. "3 minutes ago"). */
        function formatPollAge(ageMs) {
            const minutes = Math.floor(ageMs / 60000);
            if (minutes < 1) return "just now";
            if (minutes < 60) return `${minutes} minute${minutes === 1 ? "" : "s"} ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} hour${hours === 1 ? "" : "s"} ago`;
            const days = Math.floor(hours / 24);
            return `${days} day${days === 1 ? "" : "s"} ago`;
        }

        function refreshLiveIndicator() {
            const t = parseLastUpdated(lastPollerIso);
            if (Number.isNaN(t)) {
                liveDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 shrink-0 animate-pulse";
                liveLabel.textContent =
                    "No poll time yet — run the poller or check GitHub Actions";
                return;
            }
            const age = Date.now() - t;
            const clockStr = new Date(t).toLocaleTimeString(undefined, {
                hour: "numeric",
                minute: "2-digit",
            });
            const relative = formatPollAge(age);
            const detail = `last polled ${relative} (${clockStr})`;
            if (age <= FRESH_MS) {
                liveDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0";
                liveLabel.textContent = `Online · ${detail}`;
            } else if (age <= OFFLINE_MS) {
                liveDot.className = "w-2.5 h-2.5 rounded-full bg-samtec-orange shrink-0";
                liveLabel.textContent = `Delayed · ${detail}`;
            } else {
                liveDot.className = "w-2.5 h-2.5 rounded-full bg-red-600 shrink-0";
                liveLabel.textContent = `Offline · ${detail}`;
            }
        }

        function updateStatusSummary(slots) {
            if (!statusSummaryEl) return;
            if (!slots || !Array.isArray(slots)) {
                statusSummaryEl.textContent = "—";
                return;
            }
            let open = 0;
            let charging = 0;
            let move = 0;
            let emptyStall = 0;
            let other = 0;
            for (const r of slots) {
                if (!r) {
                    emptyStall++;
                    continue;
                }
                if (r.eff === "available") open++;
                else if (r.eff === "charging") charging++;
                else if (r.eff === "complete") move++;
                else other++;
            }
            let line = `${open} open · ${charging} charging · ${move} move the car`;
            if (emptyStall > 0) {
                line += ` · ${emptyStall} spot${emptyStall === 1 ? "" : "s"} unassigned`;
            }
            if (other > 0) {
                line += ` · ${other} other`;
            }
            statusSummaryEl.textContent = line;
        }

        function renderFromCache() {
            const data = lastStationPayload;
            if (!data) {
                lastPollerIso = null;
                lastRowsSorted = [];
                if (statusSummaryEl) statusSummaryEl.textContent = "—";
                refreshLiveIndicator();
                parkingLotEl.innerHTML = `<div class="col-span-full text-sm text-stone-500 py-8 text-center border border-dashed border-stone-600 rounded-lg">No data at /stations</div>`;
                completeListEl.innerHTML = `<div class="text-sm text-stone-500 px-4 py-3 border-b border-stone-800">None right now.</div>`;
                return;
            }
            lastPollerIso = data.last_updated ?? null;
            const ext = lastExtMap && typeof lastExtMap === "object" ? lastExtMap : {};
            const resets = lastResetMap && typeof lastResetMap === "object" ? lastResetMap : {};
            const now = Date.now();
            const annotatedStable = annotateRows(data, ext, resets, now);
            const slots = stallSlotsFromRows(annotatedStable);
            updateStatusSummary(slots);
            renderParkingLot(slots, ext);
            lastRowsSorted = flattenPortsSortedByStatus(data, ext, resets, now);
            updateCompleteTracking(lastRowsSorted);
            renderCompleteList(lastRowsSorted);
            refreshLiveIndicator();
        }

        onValue(
            stationsRef,
            (snap) => {
                lastStationPayload = snap.val();
                renderFromCache();
            },
            (err) => {
                console.error(err);
                liveDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 shrink-0";
                liveLabel.textContent = "error";
            }
        );

        onValue(
            extensionsRef,
            (snap) => {
                lastExtMap = snap.val() || {};
                if (lastStationPayload) renderFromCache();
            },
            (err) => {
                console.error(err);
            }
        );

        onValue(
            resetsRef,
            (snap) => {
                lastResetMap = snap.val() || {};
                if (lastStationPayload) renderFromCache();
            },
            (err) => {
                console.error(err);
            }
        );

        parkingLotEl.addEventListener("click", (e) => {
            const resetBtn = e.target.closest("[data-reset-key]");
            if (resetBtn) {
                const key = resetBtn.getAttribute("data-reset-key");
                if (!key) return;
                const ok = confirm("Reset this spot's timer because a new car just parked here?");
                if (!ok) return;
                const now = Date.now();
                set(ref(db, `slot_resets/${key}`), {
                    at: new Date(now).toISOString(),
                    at_ms: now,
                })
                    .then(() => set(ref(db, `slot_extensions/${key}`), null))
                    .catch((err) => {
                        console.error(err);
                        alert(
                            "Could not reset timer. In Firebase Realtime Database rules, allow read/write for /slot_resets."
                        );
                    });
                return;
            }

            const btn = e.target.closest("[data-extend-key]");
            if (!btn) return;
            const key = btn.getAttribute("data-extend-key");
            if (!key) return;
            pendingExtendKey = key;
            extendNameInput.value = "";
            extendMinutesInput.value = "120";
            extendModal.classList.remove("hidden");
            extendModal.setAttribute("aria-hidden", "false");
            extendNameInput.focus();
        });

        function closeExtendModal() {
            pendingExtendKey = null;
            extendModal.classList.add("hidden");
            extendModal.setAttribute("aria-hidden", "true");
        }

        extendCancelBtn.addEventListener("click", closeExtendModal);
        extendModal.addEventListener("click", (e) => {
            if (e.target === extendModal) closeExtendModal();
        });

        extendSaveBtn.addEventListener("click", async () => {
            if (!pendingExtendKey) return;
            const name = extendNameInput.value.trim();
            const extra = Math.min(480, Math.max(15, parseInt(extendMinutesInput.value, 10) || 120));
            if (!name) {
                alert("Enter your name.");
                return;
            }
            if (!lastStationPayload) return;
            const rows = annotateRows(lastStationPayload, lastExtMap || {}, lastResetMap || {}, Date.now());
            const row = rows.find((r) => r.key === pendingExtendKey);
            if (!row) {
                alert("Spot not found.");
                return;
            }
            const start = parseIsoToMs(row.sessionStartedAt);
            if (!Number.isFinite(start)) {
                alert("Session clock not ready yet — wait for the next poller run (up to ~5 min).");
                return;
            }
            const base = start + row.limitMin * 60 * 1000;
            const prev = (lastExtMap || {})[row.key] || {};
            const anchor = typeof prev.until_ms === "number" && prev.until_ms > 0 ? prev.until_ms : base;
            const newUntil = Math.max(anchor, Date.now()) + extra * 60 * 1000;
            try {
                await set(ref(db, `slot_extensions/${row.key}`), {
                    by: name,
                    at: new Date().toISOString(),
                    extra_minutes: extra,
                    until_ms: newUntil,
                });
                closeExtendModal();
            } catch (err) {
                console.error(err);
                alert(
                    "Could not save extension. In Firebase Realtime Database rules, allow read/write for /slot_extensions (see database.rules.json in this repo)."
                );
            }
        });

        setInterval(() => {
            if (lastStationPayload) renderFromCache();
            else refreshLiveIndicator();
        }, 1000);
    </script>
</body>
</html>
